# mosquitto_lab.conf - settings of the Mosquitto broker for the lab network
#
# Install on the Raspberry Pi:
#   sudo cp mosquitto_lab.conf /etc/mosquitto/conf.d/lab.conf
#   sudo systemctl restart mosquitto
#
# Mosquitto 2 accepts only connections from the same computer by default.
# These two lines permit connections from the lab network with no password.
# Use this file only on the closed lab network. Module SY-2 adds a password
# and TLS.

listener 1883 0.0.0.0
allow_anonymous true
